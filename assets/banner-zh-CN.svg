<svg width="1280" height="300" viewBox="0 0 1280 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#1b263b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="60" y1="60" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2afadf"/>
      <stop offset="1" stop-color="#42a5f5"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="320" y1="60" x2="760" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2afadf"/>
      <stop offset="1" stop-color="#42a5f5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="300" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1278" height="298" fill="none" stroke="#2afadf" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Mascot icon (simplified) -->
  <g transform="translate(50, 50)">
    <!-- Antenna -->
    <line x1="90" y1="0" x2="90" y2="16" stroke="#2afadf" stroke-width="4" stroke-linecap="round"/>
    <circle cx="90" cy="-6" r="6" fill="#2afadf"/>

    <!-- Body -->
    <rect x="10" y="16" width="160" height="150" rx="26" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="3"/>

    <!-- Screen face -->
    <rect x="26" y="36" width="128" height="82" rx="12" fill="#0a1420" stroke="#2afadf" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Eyes -->
    <g>
      <rect x="50" y="64" width="13" height="24" rx="6" fill="url(#cyanGrad)"/>
      <rect x="117" y="64" width="13" height="24" rx="6" fill="url(#cyanGrad)"/>
    </g>

    <!-- Mouth: simple dash -->
    <rect x="75" y="103" width="30" height="5" rx="2.5" fill="#2afadf" fill-opacity="0.8"/>

    <!-- Arms -->
    <path d="M10 76 Q-10 84 -6 106" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M170 76 Q190 84 186 106" stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Feet -->
    <rect x="38" y="166" width="16" height="20" rx="6" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="2"/>
    <rect x="126" y="166" width="16" height="20" rx="6" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="2"/>
  </g>

  <!-- Wordmark -->
  <text x="270" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="80" font-weight="700" fill="url(#textGrad)" letter-spacing="-2">MoCode</text>

  <!-- Tagline (wrapped to two lines) -->
  <text x="270" y="180" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#8fa3b8" letter-spacing="0.5">三层智能压缩上下文，长任务永不爆窗口</text>
  <text x="270" y="212" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="24" font-weight="400" fill="#8fa3b8" letter-spacing="0.5">自主读改代码、跑命令、联网查资料，改错随时回滚</text>
</svg>
