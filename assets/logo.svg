<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#1b263b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="48" y1="96" x2="208" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2afadf"/>
      <stop offset="1" stop-color="#42a5f5"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Terminal window -->
  <rect x="24" y="40" width="208" height="176" rx="24" fill="url(#bgGrad)" stroke="#2afadf" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Title bar dots -->
  <circle cx="56" cy="68" r="6" fill="#ff5f57"/>
  <circle cx="78" cy="68" r="6" fill="#febc2e"/>
  <circle cx="100" cy="68" r="6" fill="#28c840"/>

  <!-- Prompt cursor -->
  <path d="M56 128 L84 144 L56 160" stroke="url(#cyanGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- Code brackets < > -->
  <g filter="url(#glow)">
    <path d="M112 120 L96 144 L112 168" stroke="#2afadf" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M152 120 L168 144 L152 168" stroke="#42a5f5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Cursor block (blinking caret) -->
  <rect x="188" y="128" width="10" height="24" rx="2" fill="#2afadf" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Bottom accent line -->
  <rect x="56" y="188" width="104" height="4" rx="2" fill="#2afadf" fill-opacity="0.25"/>
  <rect x="56" y="188" width="64" height="4" rx="2" fill="#2afadf" fill-opacity="0.6"/>
</svg>
