<g transform="translate(184 240)"><rect class="n" width="225" height="178" rx="20"/><circle cx="30" cy="31" r="8" fill="#f472b6" filter="url(#glow)"/><text x="50" y="37" class="t">01 · Intent</text><text x="24" y="77" class="s">user goal + current mode</text><text x="24" y="101" class="s">project facts + memory</text><rect x="24" y="127" width="166" height="29" rx="14" class="chip"/><text x="40" y="147" fill="#f9a8d4" font-size="12">PLAN or AUTO</text></g>
<g transform="translate(466 153)"><rect class="n" width="225" height="178" rx="20"/><circle cx="30" cy="31" r="8" fill="#c084fc" filter="url(#glow)"/><text x="50" y="37" class="t">02 · Reason</text><text x="24" y="77" class="s">stream OpenAI-compatible LLM</text><text x="24" y="101" class="s">emit text and tool calls</text><rect x="24" y="127" width="166" height="29" rx="14" class="chip"/><text x="40" y="147" fill="#d8b4fe" font-size="12">TRACE EVERY STEP</text></g>
<g transform="translate(748 153)"><rect class="n" width="225" height="178" rx="20"/><circle cx="30" cy="31" r="8" fill="#818cf8" filter="url(#glow)"/><text x="50" y="37" class="t">03 · Schedule</text><text x="24" y="77" class="s">group by capabilities</text><text x="24" y="101" class="s">parallel safe reads</text><rect x="24" y="127" width="173" height="29" rx="14" class="chip"/><text x="40" y="147" fill="#a5b4fc" font-size="12">SERIALIZE MUTATIONS</text></g>
<g transform="translate(1030 240)"><rect class="n" width="225" height="178" rx="20"/><circle cx="30" cy="31" r="8" fill="#22d3ee" filter="url(#glow)"/><text x="50" y="37" class="t">04 · Execute</text><text x="24" y="77" class="s">sandbox · locks · retry</text><text x="24" y="101" class="s">rollback capture · abort</text><rect x="24" y="127" width="174" height="29" rx="14" class="chip"/><text x="40" y="147" fill="#67e8f9" font-size="12">NEVER THROW UPWARD</text></g>
<g transform="translate(748 408)"><rect class="n" width="225" height="152" rx="20"/><circle cx="30" cy="31" r="8" fill="#34d399" filter="url(#glow)"/><text x="50" y="37" class="t">05 · Observe</text><text x="24" y="76" class="s">typed result encoding</text><text x="24" y="100" class="s">lifecycle + token budget</text><text x="24" y="126" fill="#6ee7b7" font-size="12">FEED BACK TO HISTORY</text></g>
