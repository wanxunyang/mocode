<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc"><title id="title">MoCode autonomous execution loop</title><desc id="desc">The agent loop connects streamed model output to capability-aware scheduling, guarded execution, context encoding, and validation.</desc><defs><linearGradient id="bg" x2="1"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#1b263b"/></linearGradient><linearGradient id="g" x2="1"><stop stop-color="#ff4d8d"/><stop offset=".5" stop-color="#a855f7"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.k{fill:#7f8aa8;font-size:13px;letter-spacing:2px}.h{fill:#f8fafc;font-size:25px;font-weight:700}.n{fill:#17192c;stroke:#353b5b;stroke-width:1.4}.t{fill:#f6f7ff;font-size:18px;font-weight:650}.s{fill:#929dbb;font-size:13px}.w{fill:none;stroke:#59627e;stroke-width:2}.chip{fill:#111827;stroke:#34405f}</style></defs><rect width="1440" height="650" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1438" height="648" rx="27" fill="none" stroke="#2afadf" stroke-opacity="0.18" stroke-width="2"/><text x="70" y="65" class="k">THE AUTONOMOUS LOOP</text><text x="70" y="104" class="h">Every observation sharpens the next decision.</text>
