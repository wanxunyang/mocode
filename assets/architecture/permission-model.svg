<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="t d"><title id="t">MoCode permission model</title><desc id="d">Tool classes, four-tier grants, fingerprinting, persistent storage, and non-interactive safety.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#1b263b"/></linearGradient><linearGradient id="cool" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><linearGradient id="hot" x2="1"><stop stop-color="#ff4d8d"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.k{fill:#7f8aa8;font-size:13px;letter-spacing:2px}.h{fill:#f8fafc;font-size:25px;font-weight:700}.n{fill:#16192c;stroke:#343b58;stroke-width:1.3}.t{fill:#f6f7ff;font-size:17px;font-weight:650}.s{fill:#929dbb;font-size:12px}.w{fill:none;stroke:#59627e;stroke-width:2}.c{fill:#111827;stroke:#34405f}.d{stroke-dasharray:6 7}</style></defs>
<rect width="1440" height="780" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1438" height="778" rx="27" fill="none" stroke="#2afadf" stroke-opacity=".18" stroke-width="2"/>
<text x="70" y="68" class="k">MO CODE / PERMISSION MODEL</text><text x="70" y="108" class="h">Confirm before mutate. Lock it down when you stop typing.</text><text x="70" y="135" class="s">Capability class · four-tier grants · fingerprinting · durable storage · non-interactive safety</text>

<!-- LEFT: tool classes -->
<g transform="translate(70 175)"><rect class="n" width="380" height="500" rx="18"/><rect width="7" height="500" rx="3" fill="url(#cool)" filter="url(#g)"/><text x="28" y="30" class="k">TOOL CLASS</text>
<g transform="translate(28 60)"><rect width="324" height="84" rx="12" fill="#101b29" stroke="#245069"/><text x="18" y="28" class="t">Safe</text><text x="18" y="52" class="s">read_file, glob, grep, codegraph, web_*</text><text x="18" y="72" fill="#67e8f9" font-size="12">no panel · just runs</text></g>
<g transform="translate(28 162)"><rect width="324" height="84" rx="12" fill="#101b29" stroke="#245069"/><text x="18" y="28" class="t">Confirm</text><text x="18" y="52" class="s">edit_file, write_file (capped regions)</text><text x="18" y="72" fill="#fde68a" font-size="12">panel · wait for user</text></g>
<g transform="translate(28 264)"><rect width="324" height="84" rx="12" fill="#1d1629" stroke="#7c3aed"/><text x="18" y="28" class="t">Dangerous</text><text x="18" y="52" class="s">run_command · mcp__* (stdio / http / sse)</text><text x="18" y="72" fill="#f9a8d4" font-size="12">panel · always warned</text></g>
<g transform="translate(28 380)"><rect width="324" height="84" rx="12" fill="#101b29" stroke="#3a4f70"/><text x="18" y="28" class="t">Plan-mode disabled</text><text x="18" y="52" class="s">stripped from schema + runtime backstop</text><text x="18" y="72" fill="#aeb8d2" font-size="12">never ask · deny silently</text></g></g>

<!-- Middle: four-tier grants -->
<g transform="translate(490 175)"><rect class="n" width="500" height="500" rx="18"/><rect width="7" height="500" rx="3" fill="url(#hot)" filter="url(#g)"/><text x="28" y="30" class="k">FOUR-TIER GRANT</text>
<text x="28" y="62" class="s">tool name + fingerprint + scope must all match · grants never silently widen</text>
<g transform="translate(28 86)"><rect width="444" height="80" rx="12" fill="#1c152d" stroke="#a84e9b"/><circle cx="22" cy="22" r="6" fill="#a5b4fc"/><text x="40" y="28" class="t">Once · this turn only</text><text x="22" y="58" class="s">fp = current args · no persistence</text></g>
<g transform="translate(28 180)"><rect width="444" height="80" rx="12" fill="#1c152d" stroke="#a84e9b"/><circle cx="22" cy="22" r="6" fill="#67e8f9"/><text x="40" y="28" class="t">Session · current chat</text><text x="22" y="58" class="s">survives tool failures · cleared on /clear</text></g>
<g transform="translate(28 274)"><rect width="444" height="80" rx="12" fill="#1c152d" stroke="#a84e9b"/><circle cx="22" cy="22" r="6" fill="#c084fc"/><text x="40" y="28" class="t">Project · canonicalized root</text><text x="22" y="58" class="s">fp = resource path hash · locks to repo dir</text></g>
<g transform="translate(28 368)"><rect width="444" height="80" rx="12" fill="#1c152d" stroke="#f43f5e"/><circle cx="22" cy="22" r="6" fill="#f9a8d4"/><text x="40" y="28" class="t">Global · this tool, all args</text><text x="22" y="58" class="s">"never ask again" · shows risky warning</text></g>
<g transform="translate(28 462)"><rect width="444" height="28" rx="14" fill="#0f1524" stroke="#34405f"/><text x="14" y="19" fill="#aeb8d2" font-size="12">fingerprint: command hash (run_command) | path hash (file tools) | args hash (others)</text></g></g>

<!-- RIGHT: storage + non-interactive -->
<g transform="translate(1030 175)"><rect class="n" width="340" height="500" rx="18"/><rect width="7" height="500" rx="3" fill="url(#cool)" filter="url(#g)"/><text x="28" y="30" class="k">~/.mocode/permissions.json v3</text>
<g transform="translate(28 56)"><rect width="284" height="160" rx="10" fill="#0f1524" stroke="#3a4f70"/><text x="14" y="22" class="s">grants[]</text><text x="14" y="44" class="s">  { tool, fingerprint,</text><text x="14" y="62" class="s">    scope: project|session,</text><text x="14" y="80" class="s">    projectRoot }</text><text x="14" y="106" class="s">alwaysAllowTools[]</text><text x="14" y="128" class="s">  [ "use_skill", … ]</text><text x="14" y="150" class="s">schemaVersion: 3</text></g>
<g transform="translate(28 232)"><rect width="284" height="64" rx="10" fill="#0f1524" stroke="#3a4f70"/><text x="14" y="22" class="s">v2 resource grants are still loaded.</text><text x="14" y="44" class="s">v1 allowForever: ["run_command"] is NOT migrated.</text></g>
<g transform="translate(28 312)"><rect width="284" height="88" rx="10" fill="#1a1320" stroke="#7c3aed"/><text x="14" y="24" class="t">Non-interactive safety</text><text x="14" y="48" class="s">CI / piped stdin defaults to DENY on every confirm</text><text x="14" y="68" class="s">MOCODE_PERMISSION_NON_INTERACTIVE_ALLOW=true to opt-in</text></g>
<g transform="translate(28 416)"><rect width="284" height="64" rx="10" fill="#0f1524" stroke="#34405f"/><text x="14" y="22" class="t">Master switch</text><text x="14" y="44" class="s">MOCODE_PERMISSION=false disables the whole layer</text></g></g>

<!-- ORDER ARROWS -->
<g transform="translate(70 700)"><text x="0" y="0" class="s">panel fires BEFORE tool header · so the user is never shown a result they never approved</text></g>
<line x1="450" y1="270" x2="490" y2="270" class="w"/><line x1="990" y1="270" x2="1030" y2="270" class="w"/></svg>
