<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="690" viewBox="0 0 1440 690"><defs><linearGradient id="b" x2="1"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#1b263b"/></linearGradient><style>text{font-family:Inter,Segoe UI,Microsoft YaHei,sans-serif}.k{fill:#7f8aa8;font-size:13px;letter-spacing:2px}.h{fill:#f8fafc;font-size:25px;font-weight:700}.t{fill:#f5f7ff;font-size:17px;font-weight:650}.s{fill:#919dbb;font-size:12px}.n{fill:#16192b;stroke:#353b58}.w{stroke:#555f7d;stroke-width:2}</style></defs><rect width="1440" height="690" rx="28" fill="url(#b)"/><rect x="1" y="1" width="1438" height="688" rx="27" fill="none" stroke="#2afadf" stroke-opacity="0.18" stroke-width="2"/><text x="70" y="65" class="k">多 AGENT 协调</text><text x="70" y="104" class="h">并行探索，隔离创作，安全集成。</text><g transform="translate(555 137)"><rect width="330" height="100" rx="19" fill="#21152f" stroke="#8b4b92"/><text x="35" y="43" class="t">主 Agent</text><text x="35" y="69" class="s">拆解任务 · 分派工作 · 集成结果</text></g><path d="M650 237l-340 84M720 237v84M790 237l340 84" class="w"/><g transform="translate(100 321)"><rect class="n" width="420" height="152" rx="19" stroke="#245069"/><text x="24" y="32" class="k">只读通道 / 并发</text><text x="40" y="88" class="t">侦察 A　　侦察 B　　侦察 C</text><text x="40" y="116" class="s">代码图谱　　资料研究　　架构分析</text></g><g transform="translate(555 321)"><rect class="n" width="330" height="152" rx="19" stroke="#634087"/><text x="24" y="32" class="k">写入通道 / 私有</text><text x="40" y="88" class="t">文件系统 Overlay A</text><text x="40" y="116" class="s">完整工具能力 · 不直接写主目录</text></g><g transform="translate(920 321)"><rect class="n" width="420" height="152" rx="19" stroke="#634087"/><text x="24" y="32" class="k">写入通道 / 私有</text><text x="40" y="88" class="t">Overlay B　　 Overlay C</text><text x="40" y="116" class="s">已知写集，可并行生成变更</text></g><path d="M310 473l250 80M720 473v80M1130 473l-250 80" class="w"/><g transform="translate(410 534)"><rect width="620" height="105" rx="19" fill="#101d2a" stroke="#26627a"/><text x="27" y="29" class="k">CHANGESET 协调器</text><text x="27" y="58" class="t">预期哈希 → 规范化资源锁 → 原子合并</text><text x="27" y="82" class="s">冲突绝不覆盖 · 拒绝二进制变更 · 主 Agent 统一执行验证</text></g><text x="70" y="660" class="s">独立历史只返回发现、读取集、Token 用量与结构化变更，不把过程噪声带回主线。</text></svg>
