<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="t d"><title id="t">MoCode 上下文控制</title><desc id="d">五个独立开关,观察结果生命周期,以及 token 预算自校准。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#1b263b"/></linearGradient><linearGradient id="bar" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f43f5e"/></linearGradient><linearGradient id="cool" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>text{font-family:Inter,Segoe UI,Microsoft YaHei,sans-serif}.k{fill:#7f8aa8;font-size:13px;letter-spacing:2px}.h{fill:#f8fafc;font-size:25px;font-weight:700}.n{fill:#16192c;stroke:#343b58;stroke-width:1.3}.t{fill:#f6f7ff;font-size:17px;font-weight:650}.s{fill:#929dbb;font-size:12px}.w{fill:none;stroke:#59627e;stroke-width:2}.state{fill:#111827;stroke:#3e4969}.chip{fill:#111827;stroke:#34405f}</style></defs><rect width="1440" height="780" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1438" height="778" rx="27" fill="none" stroke="#2afadf" stroke-opacity=".18" stroke-width="2"/><text x="70" y="68" class="k">上下文控制</text><text x="70" y="108" class="h">五个开关,每个都是可独立调节的旋钮。</text><text x="70" y="135" class="s">独立开关 · 单行环境变量即生效 · 即使全关,生命周期仍按基线运行</text><g transform="translate(70 180)"><rect class="n" width="1300" height="180" rx="16"/><rect width="6" height="180" rx="3" fill="url(#bar)" filter="url(#gl)"/><text x="22" y="30" class="k">五个独立开关</text><g transform="translate(22 50)"><rect class="n" width="244" height="110" rx="12"/><rect width="6" height="110" rx="3" fill="#10b981" filter="url(#gl)"/><text x="16" y="22" class="t">autoCompact</text><text x="16" y="44" class="s">push 事件触发压缩</text><text x="16" y="64" class="s">阈值 = 0.85 倍上下文窗口</text><text x="16" y="84" fill="#aeb8d2" font-size="11">MOCODE_AUTO_COMPACT=false</text><g transform="translate(170 84)"><rect width="56" height="18" rx="9" fill="#10b981"/><text x="8" y="13" fill="#062a18" font-size="11" font-weight="700">开</text></g></g><g transform="translate(286 50)"><rect class="n" width="244" height="110" rx="12"/><rect width="6" height="110" rx="3" fill="#10b981" filter="url(#gl)"/><text x="16" y="22" class="t">contextOptimize</text><text x="16" y="44" class="s">tree / search / log / code 编码器</text><text x="16" y="64" class="s">限制每次 push 的工具结果长度</text><text x="16" y="84" fill="#aeb8d2" font-size="11">MOCODE_CONTEXT_OPTIMIZE=false</text><g transform="translate(170 84)"><rect width="56" height="18" rx="9" fill="#10b981"/><text x="8" y="13" fill="#062a18" font-size="11" font-weight="700">开</text></g></g><g transform="translate(550 50)"><rect class="n" width="244" height="110" rx="12"/><rect width="6" height="110" rx="3" fill="#10b981" filter="url(#gl)"/><text x="16" y="22" class="t">contextRelprune</text><text x="16" y="44" class="s">被取代的读取 → STUB</text><text x="16" y="64" class="s">保留文件路径与来源</text><text x="16" y="84" fill="#aeb8d2" font-size="11">MOCODE_CONTEXT_RELPRUNE=false</text><g transform="translate(170 84)"><rect width="56" height="18" rx="9" fill="#10b981"/><text x="8" y="13" fill="#062a18" font-size="11" font-weight="700">开</text></g></g><g transform="translate(814 50)"><rect class="n" width="244" height="110" rx="12"/><rect width="6" height="110" rx="3" fill="#10b981" filter="url(#gl)"/><text x="16" y="22" class="t">contextLifecycle</text><text x="16" y="44" class="s">生产者 → 消费者图</text><text x="16" y="64" class="s">孤儿 + 老化检测</text><text x="16" y="84" fill="#aeb8d2" font-size="11">MOCODE_CONTEXT_LIFECYCLE=false</text><g transform="translate(170 84)"><rect width="56" height="18" rx="9" fill="#10b981"/><text x="8" y="13" fill="#062a18" font-size="11" font-weight="700">开</text></g></g><g transform="translate(1078 50)"><rect class="n" width="200" height="110" rx="12"/><rect width="6" height="110" rx="3" fill="#10b981" filter="url(#gl)"/><text x="16" y="22" class="t">contextBudget</text><text x="16" y="44" class="s">五区调度器</text><text x="16" y="64" class="s">告警 → 清理 → 压缩</text><text x="16" y="84" fill="#aeb8d2" font-size="11">MOCODE_CONTEXT_BUDGET=false</text><g transform="translate(126 84)"><rect width="56" height="18" rx="9" fill="#10b981"/><text x="8" y="13" fill="#062a18" font-size="11" font-weight="700">开</text></g></g></g><g transform="translate(70 395)"><rect class="n" width="820" height="200" rx="16"/><rect width="6" height="200" rx="3" fill="url(#cool)" filter="url(#gl)"/><text x="22" y="30" class="k">观察结果生命周期 · 即使五个开关全关也照常运行</text><g transform="translate(22 80)"><rect class="state" width="170" height="58" rx="29"/><circle cx="29" cy="29" r="8" fill="#22d3ee"/><text x="50" y="35" class="t">LIVE</text></g><path d="M192 109h60" class="w"/><text x="200" y="100" class="s">下一轮被引用</text><g transform="translate(252 80)"><rect class="state" width="200" height="58" rx="29"/><circle cx="29" cy="29" r="8" fill="#818cf8"/><text x="50" y="35" class="t">REFERENCED</text></g><path d="M452 109h60" class="w"/><text x="460" y="100" class="s">没有生产者指向它</text><g transform="translate(512 80)"><rect class="state" width="200" height="58" rx="29"/><circle cx="29" cy="29" r="8" fill="#c084fc"/><text x="50" y="35" class="t">OBSOLETE</text></g><g transform="translate(772 80)"><rect class="state" width="180" height="58" rx="29"/><circle cx="29" cy="29" r="8" fill="#f472b6"/><text x="50" y="35" class="t">STUB</text></g><text x="540" y="58" class="s">预算超限 → STUB</text><path d="M712 80l60 0" class="w"/></g><g transform="translate(910 395)"><rect class="n" width="460" height="200" rx="16"/><text x="22" y="30" class="k">Token 自校准</text><text x="22" y="56" class="t">避免估算静默漂移</text><g transform="translate(22 80)"><rect class="chip" width="416" height="40" rx="10"/><text x="14" y="22" class="s">estimatePromptTokens(prompt) → estimated_n</text></g><g transform="translate(22 128)"><rect class="chip" width="416" height="40" rx="10"/><text x="14" y="22" class="s">provider 返回 usage.tokens(真实值)</text></g><g transform="translate(22 176)"><rect class="chip" width="416" height="40" rx="10"/><text x="14" y="22" class="s">EWMA 对误差做加权 · 下一轮估算向真实值对齐</text></g></g><g transform="translate(70 620)"><rect class="n" width="1300" height="120" rx="16"/><rect width="6" height="120" rx="3" fill="#f43f5e" filter="url(#gl)"/><text x="22" y="30" class="k">注意 · 开关之间会互相影响</text><text x="22" y="58" class="s">autoCompact 开着而 contextBudget 关着:压缩还在,但单轮仍可能膨胀(无逐步 guard)。</text><text x="22" y="80" class="s">contextRelprune 开着而 contextLifecycle 关着:被裁剪的观察永远不会被回收。</text><text x="22" y="102" class="s">默认五个全开 · 一次只改一个并重跑 bench,别多动。</text></g><g transform="translate(70 760)"><text x="0" y="0" class="s">与 agent 循环配对:切换开关下一轮 chat() 即生效 · 当前轮不会回滚</text></g></svg>
