<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="690" viewBox="0 0 1440 690" role="img" aria-labelledby="title desc"><title id="title">MoCode multi-agent coordination</title><desc id="desc">Read-only sub-agents fan out concurrently while writer sub-agents use isolated overlays and conflict-safe ChangeSet merging.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#1b263b"/></linearGradient><linearGradient id="g" x2="1"><stop stop-color="#f43f5e"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.k{fill:#7f8aa8;font-size:13px;letter-spacing:2px}.h{fill:#f8fafc;font-size:25px;font-weight:700}.n{fill:#16192b;stroke:#353b58;stroke-width:1.3}.t{fill:#f5f7ff;font-size:17px;font-weight:650}.s{fill:#919dbb;font-size:12px}.w{fill:none;stroke:#555f7d;stroke-width:2}.d{stroke-dasharray:7 7}</style></defs><rect width="1440" height="690" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1438" height="688" rx="27" fill="none" stroke="#2afadf" stroke-opacity="0.18" stroke-width="2"/><text x="70" y="65" class="k">MULTI-AGENT COORDINATION</text><text x="70" y="104" class="h">Parallel discovery. Isolated creation. Conflict-safe integration.</text>
<g transform="translate(555 137)"><rect width="330" height="100" rx="19" fill="#21152f" stroke="#8b4b92"/><circle cx="45" cy="50" r="18" fill="url(#g)" filter="url(#glow)"/><text x="80" y="43" class="t">Main Agent</text><text x="80" y="66" class="s">decompose · delegate · integrate</text></g>
<path d="M650 237l-340 84M720 237v84M790 237l340 84" class="w"/>
<g transform="translate(100 321)"><rect class="n" width="420" height="152" rx="19" stroke="#245069"/><text x="24" y="32" class="k">READ LANE / CONCURRENT</text><g transform="translate(24 55)"><rect width="112" height="67" rx="13" fill="#102231" stroke="#246078"/><text x="16" y="28" class="t">Scout A</text><text x="16" y="49" class="s">codegraph</text></g><g transform="translate(154 55)"><rect width="112" height="67" rx="13" fill="#102231" stroke="#246078"/><text x="16" y="28" class="t">Scout B</text><text x="16" y="49" class="s">research</text></g><g transform="translate(284 55)"><rect width="112" height="67" rx="13" fill="#102231" stroke="#246078"/><text x="16" y="28" class="t">Scout C</text><text x="16" y="49" class="s">analysis</text></g></g>
<g transform="translate(555 321)"><rect class="n" width="330" height="152" rx="19" stroke="#634087"/><text x="24" y="32" class="k">WRITE LANE / PRIVATE</text><rect x="24" y="55" width="282" height="67" rx="13" fill="#211630" stroke="#79408b"/><text x="43" y="82" class="t">Filesystem Overlay</text><text x="43" y="105" class="s">full tools · no direct workspace writes</text></g>
<g transform="translate(920 321)"><rect class="n" width="420" height="152" rx="19" stroke="#634087"/><text x="24" y="32" class="k">WRITE LANE / PRIVATE</text><rect x="24" y="55" width="174" height="67" rx="13" fill="#211630" stroke="#79408b"/><text x="43" y="82" class="t">Overlay B</text><text x="43" y="105" class="s">known write set</text><rect x="222" y="55" width="174" height="67" rx="13" fill="#211630" stroke="#79408b"/><text x="241" y="82" class="t">Overlay C</text><text x="241" y="105" class="s">known write set</text></g>
<path d="M310 473l250 80M720 473v80M1130 473l-250 80" class="w d"/>
<g transform="translate(410 534)"><rect width="620" height="105" rx="19" fill="#101d2a" stroke="#26627a"/><rect x="0" width="7" height="105" rx="3" fill="url(#g)" filter="url(#glow)"/><text x="27" y="29" class="k">CHANGESET COORDINATOR</text><text x="27" y="58" class="t">expected hash → canonical resource lock → atomic merge</text><text x="27" y="82" class="s">conflict never overwrites · binary changes rejected · main agent runs one unified verification gate</text></g>
<text x="70" y="660" class="s">Independent histories return findings, read sets, usage and structured changes — not transcript noise.</text></svg>
