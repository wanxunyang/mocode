<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
<title id="title">MoCode system architecture</title><desc id="desc">Layered architecture from terminal experience through agent runtime, capability plane, and persistent intelligence.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1b2a"/><stop offset=".55" stop-color="#162338"/><stop offset="1" stop-color="#1b263b"/></linearGradient><linearGradient id="hot" x2="1"><stop stop-color="#ff4d8d"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient><linearGradient id="cool" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.label{fill:#7f8aa8;font-size:13px;letter-spacing:2px}.title{fill:#f8fafc;font-size:25px;font-weight:700}.sub{fill:#aeb8d2;font-size:14px}.node{fill:#16192c;stroke:#303653;stroke-width:1.3}.nodeTitle{fill:#f4f7ff;font-size:17px;font-weight:650}.nodeSub{fill:#8f9ab8;font-size:12px}.wire{fill:none;stroke:#47506d;stroke-width:2}.dash{stroke-dasharray:6 7}</style></defs>
<rect width="1440" height="850" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1438" height="848" rx="27" fill="none" stroke="#2afadf" stroke-opacity="0.18" stroke-width="2"/><circle cx="1220" cy="80" r="180" fill="#7c3aed" opacity=".08"/><circle cx="160" cy="760" r="220" fill="#06b6d4" opacity=".06"/>
<text x="70" y="72" class="label">MOCODE / SYSTEM MAP</text><text x="70" y="112" class="title">An autonomous coding runtime — not a chat wrapper.</text><text x="70" y="139" class="sub">Streaming interaction · controlled execution · context engineering · durable project intelligence</text>
<g transform="translate(70 182)"><rect width="1300" height="112" rx="20" fill="#111a2a" stroke="#245069"/><rect width="7" height="112" rx="3" fill="url(#cool)" filter="url(#glow)"/><text x="28" y="29" class="label">EXPERIENCE LAYER</text><g transform="translate(28 47)"><rect class="node" width="220" height="45" rx="12"/><text x="16" y="28" class="nodeTitle">Full-screen TUI</text></g><g transform="translate(270 47)"><rect class="node" width="220" height="45" rx="12"/><text x="16" y="28" class="nodeTitle">Streaming + Reasoning</text></g><g transform="translate(512 47)"><rect class="node" width="220" height="45" rx="12"/><text x="16" y="28" class="nodeTitle">Plan / Auto</text></g><g transform="translate(754 47)"><rect class="node" width="220" height="45" rx="12"/><text x="16" y="28" class="nodeTitle">Slash Commands</text></g><g transform="translate(996 47)"><rect class="node" width="248" height="45" rx="12"/><text x="16" y="28" class="nodeTitle">Resume · Rollback · Pet</text></g></g>
<path d="M720 294v37" class="wire"/><circle cx="720" cy="331" r="4" fill="#9b5cff" filter="url(#glow)"/>
<g transform="translate(70 332)"><rect width="1300" height="206" rx="20" fill="#171327" stroke="#54356f"/><rect width="7" height="206" rx="3" fill="url(#hot)" filter="url(#glow)"/><text x="28" y="30" class="label">AUTONOMOUS RUNTIME</text><g transform="translate(28 54)"><rect class="node" width="250" height="120" rx="15" stroke="#734190"/><text x="18" y="31" class="nodeTitle">REPL Orchestrator</text><text x="18" y="56" class="nodeSub">input · modes · session · UI hooks</text><text x="18" y="82" fill="#c084fc" font-size="13">goal enters the runtime</text></g><path d="M278 114h62" class="wire"/><g transform="translate(340 54)"><rect width="306" height="120" rx="15" fill="#201634" stroke="#a84e9b"/><text x="18" y="31" class="nodeTitle">Agent Core Loop</text><text x="18" y="57" class="nodeSub">LLM → tool calls → observations</text><path d="M45 89h195" stroke="url(#hot)" stroke-width="3"/><path d="M237 82l13 7-13 7" fill="#a855f7"/><text x="18" y="110" fill="#f472b6" font-size="12">repeat until done / aborted</text></g><path d="M646 114h62" class="wire"/><g transform="translate(708 54)"><rect class="node" width="250" height="120" rx="15" stroke="#734190"/><text x="18" y="31" class="nodeTitle">Tool Scheduler</text><text x="18" y="56" class="nodeSub">capabilities · grouping · retry</text><text x="18" y="82" fill="#c084fc" font-size="13">parallel reads / locked writes</text></g><path d="M958 114h62" class="wire"/><g transform="translate(1020 54)"><rect class="node" width="224" height="120" rx="15" stroke="#734190"/><text x="18" y="31" class="nodeTitle">Verification Gate</text><text x="18" y="56" class="nodeSub">discover · run · feed back</text><text x="18" y="82" fill="#c084fc" font-size="13">close the quality loop</text></g></g>
<path d="M720 538v37" class="wire"/><circle cx="720" cy="575" r="4" fill="#22d3ee" filter="url(#glow)"/>
<g transform="translate(70 576)"><rect width="1300" height="118" rx="20" fill="#101b28" stroke="#245069"/><rect width="7" height="118" rx="3" fill="url(#cool)" filter="url(#glow)"/><text x="28" y="30" class="label">CAPABILITY PLANE</text><g transform="translate(28 49)"><rect class="node" width="220" height="45" rx="12"/><text x="16" y="28" class="nodeTitle">Built-in Tools</text></g><g transform="translate(270 49)"><rect class="node" width="220" height="45" rx="12"/><text x="16" y="28" class="nodeTitle">Sandbox + Locks</text></g><g transform="translate(512 49)"><rect class="node" width="220" height="45" rx="12"/><text x="16" y="28" class="nodeTitle">Skills + MCP</text></g><g transform="translate(754 49)"><rect class="node" width="220" height="45" rx="12"/><text x="16" y="28" class="nodeTitle">Sub-agents</text></g><g transform="translate(996 49)"><rect class="node" width="248" height="45" rx="12"/><text x="16" y="28" class="nodeTitle">ChangeSet Coordinator</text></g></g>
<path d="M720 694v35" class="wire dash"/>
<g transform="translate(70 730)"><rect width="1300" height="76" rx="18" fill="#121727" stroke="#303653"/><text x="28" y="28" class="label">PERSISTENT INTELLIGENCE</text><text x="28" y="55" class="nodeTitle">Session History</text><text x="222" y="55" class="nodeTitle">Context Lifecycle</text><text x="450" y="55" class="nodeTitle">Project Snapshot</text><text x="680" y="55" class="nodeTitle">Project Skill</text><text x="868" y="55" class="nodeTitle">Long-term Memory</text><text x="1092" y="55" class="nodeTitle">Trace + Metrics</text></g>
