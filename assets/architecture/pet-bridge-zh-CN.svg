<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="t d"><title id="t">MoCode 桌宠桥</title><desc id="d">通过 WebSocket 将 agent 状态从 Node CLI 推送到 Electron 悬浮桌宠。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#1b263b"/></linearGradient><linearGradient id="cool" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><linearGradient id="hot" x2="1"><stop stop-color="#ff4d8d"/><stop offset="1" stop-color="#f43f5e"/></linearGradient><filter id="gl"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>text{font-family:Inter,Segoe UI,Microsoft YaHei,sans-serif}.k{fill:#7f8aa8;font-size:13px;letter-spacing:2px}.h{fill:#f8fafc;font-size:25px;font-weight:700}.n{fill:#16192c;stroke:#343b58;stroke-width:1.3}.t{fill:#f6f7ff;font-size:17px;font-weight:650}.s{fill:#929dbb;font-size:12px}.w{fill:none;stroke:#59627e;stroke-width:2}</style></defs>
<rect width="1440" height="700" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1438" height="698" rx="27" fill="none" stroke="#2afadf" stroke-opacity=".18" stroke-width="2"/>
<text x="70" y="68" class="k">MOCODE / 桌宠桥</text><text x="70" y="108" class="h">被动镜像 agent 状态的桌面窗口。</text><text x="70" y="135" class="s">可选子包 · 不阻塞 Node CLI · agent 主循环无改动</text>

<g transform="translate(70 195)"><rect class="n" width="420" height="430" rx="18"/><rect width="6" height="430" rx="3" fill="url(#cool)" filter="url(#gl)"/><text x="22" y="28" class="k">MOCODE-AI(Node CLI)</text>
<g transform="translate(22 56)"><rect width="378" height="80" rx="12" fill="#101b29" stroke="#245069"/><text x="14" y="26" class="t">Agent 核心循环</text><text x="14" y="50" class="s">发出 hooks:onText · onToolStart · onToolDone · onToolResult</text></g>
<g transform="translate(22 156)"><rect width="378" height="80" rx="12" fill="#1c152d" stroke="#a84e9b"/><text x="14" y="26" class="t">src/pet/state.ts</text><text x="14" y="50" class="s">订阅 hooks · 归一化为 mood + quip + activity</text></g>
<g transform="translate(22 256)"><rect width="378" height="80" rx="12" fill="#0f1524" stroke="#34405f"/><text x="14" y="26" class="t">WebSocket 服务端 · ws@8</text><text x="14" y="50" class="s">loopback 127.0.0.1 · 随机端口 · JSON 帧</text></g>
<g transform="translate(22 356)"><rect width="378" height="60" rx="12" fill="#101b29" stroke="#245069"/><text x="14" y="26" class="t">/pet slash 命令</text><text x="14" y="48" class="s">开关桥接 · 端口写入状态栏</text></g>
</g>

<g transform="translate(540 195)"><rect class="n" width="360" height="430" rx="18"/><rect width="6" height="430" rx="3" fill="url(#hot)" filter="url(#gl)"/><text x="22" y="28" class="k">事件帧</text>
<text x="22" y="62" class="t">类型化消息 · 按顺序</text>
<g transform="translate(22 86)"><rect width="316" height="60" rx="10" fill="#0f1524" stroke="#34405f"/><text x="14" y="22" class="t">thinking</text><text x="14" y="44" class="s">增量 token · "…想想…" 引语</text></g>
<g transform="translate(22 156)"><rect width="316" height="60" rx="10" fill="#0f1524" stroke="#34405f"/><text x="14" y="22" class="t">tool:start · tool:done · tool:result</text><text x="14" y="44" class="s">工具名 · 耗时 · 状态</text></g>
<g transform="translate(22 226)"><rect width="316" height="60" rx="10" fill="#0f1524" stroke="#34405f"/><text x="14" y="22" class="t">mood</text><text x="14" y="44" class="s">空闲 · 好奇 · 专注 · 疑惑 · 得意 · 疲惫</text></g>
<g transform="translate(22 296)"><rect width="316" height="60" rx="10" fill="#0f1524" stroke="#34405f"/><text x="14" y="22" class="t">quip</text><text x="14" y="44" class="s">每次状态切换配一句短台词</text></g>
<g transform="translate(22 366)"><rect width="316" height="44" rx="10" fill="#0f1524" stroke="#34405f"/><text x="14" y="28" class="s">非阻塞 · 允许丢帧 · 背压直接丢</text></g>
</g>

<g transform="translate(950 195)"><rect class="n" width="420" height="430" rx="18"/><rect width="6" height="430" rx="3" fill="url(#cool)" filter="url(#gl)"/><text x="22" y="28" class="k">packages/pet-app(Electron)</text>
<g transform="translate(22 56)"><rect width="378" height="80" rx="12" fill="#101b29" stroke="#245069"/><text x="14" y="26" class="t">main 进程</text><text x="14" y="50" class="s">frameless 窗口 · 总在最前 · 托盘隐藏</text></g>
<g transform="translate(22 156)"><rect width="378" height="80" rx="12" fill="#1c152d" stroke="#a84e9b"/><text x="14" y="26" class="t">renderer</text><text x="14" y="50" class="s">sprite 动画 · mood 混合树 · 引语气泡</text></g>
<g transform="translate(22 256)"><rect width="378" height="80" rx="12" fill="#0f1524" stroke="#34405f"/><text x="14" y="26" class="t">ws client</text><text x="14" y="50" class="s">断线重连 · 不引入 Node CLI 源码</text></g>
<g transform="translate(22 356)"><rect width="378" height="60" rx="12" fill="#101b29" stroke="#245069"/><text x="14" y="26" class="t">安装</text><text x="14" y="48" class="s">npm run build --workspace packages/pet-app · 可选</text></g>
</g>

<path d="M490 311h50" class="w"/><path d="M900 311h50" class="w"/>
<g transform="translate(495 295)"><text x="0" y="0" class="s">推送事件</text></g>
<g transform="translate(905 295)"><text x="0" y="0" class="s">自动重连</text></g>

<g transform="translate(70 650)">
  <rect class="n" width="1300" height="36" rx="12" fill="#0f1524" stroke="#34405f"/>
  <text x="20" y="22" class="s">契约:渲染层零业务逻辑 · 状态单向从 MoCode AI 流向 Electron · 桌宠对 agent 主循环无任何权限</text>
</g></svg>
