<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc"><title id="title">MoCode context and memory engine</title><desc id="desc">A layered system keeps the active prompt relevant while retaining session and cross-session knowledge.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0d1b2a"/><stop offset="1" stop-color="#1b263b"/></linearGradient><linearGradient id="bar" x2="1"><stop stop-color="#22d3ee"/><stop offset=".55" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f43f5e"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>text{font-family:Inter,Segoe UI,Arial,sans-serif}.k{fill:#7f8aa8;font-size:13px;letter-spacing:2px}.h{fill:#f8fafc;font-size:25px;font-weight:700}.n{fill:#16192b;stroke:#343a57;stroke-width:1.3}.t{fill:#f5f7ff;font-size:17px;font-weight:650}.s{fill:#919dbb;font-size:12px}.w{fill:none;stroke:#535d79;stroke-width:2}.state{fill:#111827;stroke:#3e4969}</style></defs><rect width="1440" height="720" rx="28" fill="url(#bg)"/><rect x="1" y="1" width="1438" height="718" rx="27" fill="none" stroke="#2afadf" stroke-opacity="0.18" stroke-width="2"/><text x="70" y="65" class="k">CONTEXT ENGINEERING</text><text x="70" y="104" class="h">Keep the working set small. Keep the intelligence durable.</text>
<g transform="translate(70 145)"><rect width="1300" height="70" rx="18" fill="#101827" stroke="#245069"/><rect width="1300" height="5" rx="2" fill="url(#bar)" filter="url(#glow)"/><text x="28" y="42" class="t">System Prompt</text><text x="209" y="42" class="s">current mode</text><text x="330" y="42" class="s">project snapshot</text><text x="474" y="42" class="s">project skill</text><text x="592" y="42" class="s">memory index</text><text x="716" y="42" class="s">tool schemas</text><text x="832" y="42" class="s">live conversation</text><text x="1000" y="42" fill="#67e8f9" font-size="13">→ MODEL CONTEXT WINDOW</text></g>
<path d="M720 215v49" class="w"/>
<g transform="translate(70 265)"><rect width="1300" height="175" rx="20" fill="#141628" stroke="#42375f"/><text x="28" y="33" class="k">OBSERVATION PIPELINE</text><g transform="translate(28 58)"><rect class="n" width="215" height="86" rx="14"/><text x="17" y="29" class="t">Typed Encoders</text><text x="17" y="53" class="s">tree · search · log · code</text><text x="17" y="70" class="s">table · memory · status</text></g><path d="M243 101h42" class="w"/><g transform="translate(285 58)"><rect class="n" width="215" height="86" rx="14"/><text x="17" y="29" class="t">Age-aware State</text><text x="17" y="53" class="s">fresh detail → old summary</text><text x="17" y="70" class="s">rehydrates after resume</text></g><path d="M500 101h42" class="w"/><g transform="translate(542 58)"><rect class="n" width="215" height="86" rx="14"/><text x="17" y="29" class="t">Relevance Pruner</text><text x="17" y="53" class="s">superseded reads become stubs</text><text x="17" y="70" class="s">paths preserve provenance</text></g><path d="M757 101h42" class="w"/><g transform="translate(799 58)"><rect class="n" width="215" height="86" rx="14"/><text x="17" y="29" class="t">Lifecycle Engine</text><text x="17" y="53" class="s">producer → consumer graph</text><text x="17" y="70" class="s">orphan + aging detection</text></g><path d="M1014 101h42" class="w"/><g transform="translate(1056 58)"><rect class="n" width="216" height="86" rx="14"/><text x="17" y="29" class="t">Budget Scheduler</text><text x="17" y="53" class="s">five zones · ROI ranking</text><text x="17" y="70" class="s">warn → sweep → compact</text></g></g>
<g transform="translate(164 474)"><text x="0" y="0" class="k">OBSERVATION LIFECYCLE</text><g transform="translate(0 27)"><rect class="state" width="160" height="58" rx="29"/><circle cx="29" cy="29" r="8" fill="#22d3ee"/><text x="50" y="35" class="t">LIVE</text></g><path d="M160 56h56" class="w"/><g transform="translate(216 27)"><rect class="state" width="190" height="58" rx="29"/><circle cx="29" cy="29" r="8" fill="#818cf8"/><text x="50" y="35" class="t">REFERENCED</text></g><path d="M406 56h56" class="w"/><g transform="translate(462 27)"><rect class="state" width="180" height="58" rx="29"/><circle cx="29" cy="29" r="8" fill="#c084fc"/><text x="50" y="35" class="t">OBSOLETE</text></g><path d="M642 56h56" class="w"/><g transform="translate(698 27)"><rect class="state" width="160" height="58" rx="29"/><circle cx="29" cy="29" r="8" fill="#f472b6"/><text x="50" y="35" class="t">STUB</text></g><text x="884" y="62" class="s">less noise · same provenance</text></g>
<g transform="translate(70 610)"><rect width="1300" height="68" rx="18" fill="#111728" stroke="#303653"/><text x="25" y="27" class="k">DURABLE KNOWLEDGE</text><text x="25" y="52" class="t">Session JSON</text><text x="205" y="52" class="t">notes.md</text><text x="347" y="52" class="t">Snapshot: what / where</text><text x="631" y="52" class="t">Skill: why / how</text><text x="855" y="52" class="t">Memory: cross-session facts</text><text x="1162" y="52" fill="#f9a8d4" font-size="13">/resume</text></g></svg>
