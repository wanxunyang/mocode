<svg width="1280" height="300" viewBox="0 0 1280 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1280" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#1b263b"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="60" y1="60" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2afadf"/>
      <stop offset="1" stop-color="#42a5f5"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="320" y1="60" x2="760" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2afadf"/>
      <stop offset="1" stop-color="#42a5f5"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="48" y1="48" x2="208" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b263b"/>
      <stop offset="1" stop-color="#0d1b2a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="300" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1278" height="298" fill="none" stroke="#2afadf" stroke-opacity="0.18" stroke-width="2"/>

  <!-- Mascot icon (256x256 native, scaled to 200x200 at 50,50) -->
  <g transform="translate(50 50) scale(0.78125)">
    <!-- Antenna -->
    <line x1="128" y1="30" x2="128" y2="50" stroke="#2afadf" stroke-width="4" stroke-linecap="round"/>
    <circle id="pet-antenna" cx="128" cy="24" r="7" fill="#2afadf" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Body / terminal head -->
    <g id="pet-body-group">
      <rect id="pet-body" x="40" y="50" width="176" height="150" rx="28" fill="url(#bodyGrad)" stroke="url(#cyanGrad)" stroke-width="3"/>

      <!-- Screen face -->
      <rect x="60" y="72" width="136" height="90" rx="14" fill="#0a1420" stroke="#2afadf" stroke-opacity="0.4" stroke-width="1.5"/>

      <!-- Eyes (blinking) -->
      <g filter="url(#glow)">
        <rect x="86" y="104" width="14" height="26" rx="6" fill="url(#cyanGrad)">
          <animate attributeName="height" values="26;2;26" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite"/>
          <animate attributeName="y" values="104;117;104" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite"/>
        </rect>
        <rect x="156" y="104" width="14" height="26" rx="6" fill="url(#cyanGrad)">
          <animate attributeName="height" values="26;2;26" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite"/>
          <animate attributeName="y" values="104;117;104" keyTimes="0;0.5;1" dur="3.2s" repeatCount="indefinite"/>
        </rect>
      </g>

      <!-- Mouth -->
      <rect id="pet-mouth" x="112" y="147" width="32" height="6" rx="3" fill="#2afadf" fill-opacity="0.8" filter="url(#glow)"/>
    </g>

    <!-- Arms -->
    <circle id="pet-arm-left" cx="34" cy="128" r="14" fill="url(#bodyGrad)" stroke="url(#cyanGrad)" stroke-width="2.5"/>
    <circle id="pet-arm-right" cx="222" cy="128" r="14" fill="url(#bodyGrad)" stroke="url(#cyanGrad)" stroke-width="2.5"/>

    <!-- Legs / feet -->
    <rect x="76" y="200" width="20" height="26" rx="8" fill="url(#bodyGrad)" stroke="url(#cyanGrad)" stroke-width="2.5"/>
    <rect x="160" y="200" width="20" height="26" rx="8" fill="url(#bodyGrad)" stroke="url(#cyanGrad)" stroke-width="2.5"/>
  </g>

  <!-- Wordmark -->
  <text x="270" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="80" font-weight="700" fill="url(#textGrad)" letter-spacing="-2">MoCode</text>

  <!-- Tagline (wrapped to two lines) -->
  <text x="270" y="180" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#8fa3b8" letter-spacing="0.3">Three-tier context compression, long sessions never overflow</text>
  <text x="270" y="212" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#8fa3b8" letter-spacing="0.3">Autonomous coding, commands &amp; web research, rollback anytime</text>
</svg>
