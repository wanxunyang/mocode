<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mocode Work</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="style.css" />
    <script>
      // 首屏前同步应用主题，避免加载闪烁。优先级:localStorage > 系统偏好。
      (function () {
        try {
          var saved = localStorage.getItem('mocode-work-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (systemDark ? 'dark' : 'light');
          var effectiveTheme = theme === 'system' ? (systemDark ? 'dark' : 'light') : theme;
          document.documentElement.dataset.theme = effectiveTheme;
        } catch { /* localStorage 不可用时走默认浅色 */ }
      })();
    </script>
  </head>
  <body>
    <div class="app-shell">
      <div class="titlebar"><span class="titlebar-brand"><img class="titlebar-brand-logo" src="../assets/icon.png" alt="Mocode" title="Mocode" /><span class="titlebar-brand-text">Mocode</span></span></div>
      <div class="app-body">
      <aside class="sidebar">
        <header class="brand-row"><button class="icon-button muted" id="sidebar-toggle" data-sidebar-toggle title="折叠 / 展开侧栏" aria-label="折叠 / 展开侧栏" aria-pressed="false"><svg class="icon" data-icon="panel-left"></svg></button><div class="brand-actions"><button class="icon-button muted" id="add-project" title="添加项目" aria-label="添加项目"><svg class="icon" data-icon="plus"></svg></button><button class="icon-button muted" id="search-button" title="搜索 (⌘K)" aria-label="搜索"><svg class="icon" data-icon="search"></svg></button><button class="icon-button muted" id="theme-toggle" title="切换主题" aria-label="切换主题"><svg class="icon" data-icon="moon"></svg><svg class="icon icon-swap" data-icon="sun"></svg></button></div></header>
        <nav class="primary-nav" aria-label="主导航">
          <button class="nav-item active" id="new-task"><svg class="icon" data-icon="circle-plus"></svg>新建任务</button>
          <button class="nav-item" id="pull-requests"><svg class="icon" data-icon="git-pull-request"></svg>拉取请求</button>
        </nav>
        <section class="sidebar-section tasks-section"><div id="task-list" class="task-list"><p class="empty-tasks">无任务</p></div></section>
        <button class="sidebar-footer" id="settings-button" title="设置与帮助" aria-haspopup="true" aria-expanded="false">
          <span class="avatar">M</span>
          <span class="footer-brand">Mocode</span>
          <span class="usage" id="usage">0%</span>
          <svg class="icon footer-chevron" data-icon="chevron-down"></svg>
        </button>
        <div class="settings-popover hidden" id="settings-popover" role="menu" aria-label="设置与帮助">
          <div class="settings-group">
            <span class="settings-label">外观</span>
            <div class="settings-segmented" id="theme-segmented" role="group" aria-label="主题">
              <button data-theme="light" role="menuitemradio" aria-checked="false">浅色</button>
              <button data-theme="dark" role="menuitemradio" aria-checked="false">深色</button>
              <button data-theme="system" role="menuitemradio" aria-checked="false">自动</button>
            </div>
          </div>
          <button class="settings-item" id="settings-shortcuts" role="menuitem"><svg class="icon" data-icon="keyboard"></svg>键盘快捷键</button>
          <button class="settings-item" id="settings-about" role="menuitem"><svg class="icon" data-icon="info"></svg>关于 Mocode Work</button>
        </div>
        <div class="sidebar-resize" id="sidebar-resize" aria-label="拖动调整侧栏宽度" role="separator" aria-orientation="vertical"></div>
      </aside>
      <main class="workspace">
        <button class="sidebar-floating-toggle" id="sidebar-toggle-floating" data-sidebar-toggle title="展开侧栏" aria-label="展开侧栏"><svg class="icon" data-icon="panel-left"></svg></button>
        <div class="workspace-actions" aria-label="视图操作"><button id="toggle-inspector" title="项目概览"><svg class="icon" data-icon="layout"></svg></button><button id="show-files" title="浏览文件"><svg class="icon" data-icon="files"></svg></button></div>
          <section id="empty-state" class="empty-state">
          <h1>开始一个任务</h1>
          <p>选好左侧项目，点「新建任务」给它起个名字，再描述要做的改动。Mocode 会分析代码、调用工具、修改文件，每一步都显示在这里。</p>
        </section>
        <section id="conversation" class="conversation" aria-live="polite"></section>
        <section id="approval-panel" class="approval-panel hidden"></section>
        <aside id="inspector" class="inspector hidden">
          <header class="inspector-header"><b id="inspector-title">项目概览</b><button id="close-inspector" title="关闭" aria-label="关闭"><svg class="icon" data-icon="close"></svg></button></header>
          <nav class="inspector-tabs"><button data-tab="overview" class="selected">概览</button><button data-tab="files">文件</button><button data-tab="prs">拉取请求</button></nav>
          <div id="inspector-content" class="inspector-content"></div>
        </aside>
        <section id="search-panel" class="search-panel hidden"><div class="search-dialog"><input id="search-input" placeholder="搜索项目或任务" /><div id="search-results"></div></div></section>
        <footer class="composer-area">
          <div class="composer">
            <div class="composer-task" id="composer-task" hidden>
              <span class="composer-task-label">任务</span>
              <button class="composer-task-name" id="composer-task-name" title="点击重命名当前任务"></button>
              <button class="composer-task-edit icon-button muted" id="composer-task-edit" title="重命名" aria-label="重命名"><svg class="icon" data-icon="edit"></svg></button>
            </div>
            <div id="attachment-list" class="attachment-list"></div>
            <textarea id="prompt" rows="1" placeholder="描述输入"></textarea>
            <div class="composer-actions"><div class="left-actions"><button class="plus-button icon-button-square" id="add-attachment" title="添加图片 (也可拖入)" aria-label="添加图片"><svg class="icon" data-icon="image"></svg></button><button class="compact-button" id="compact-button" title="压缩会话上下文"><svg class="icon icon-inline" data-icon="layers-compress"></svg>压缩</button><span class="context-usage" id="context-usage" title="上下文占用">--</span></div><div class="right-actions"><button id="mode-button" class="model-button" title="切换模型" aria-haspopup="listbox" aria-expanded="false"><span class="mode-label">Mocode Agent</span><svg class="icon icon-inline" data-icon="chevron-down"></svg></button><button id="send-button" class="send-button" title="发送 (⌘⏎)" aria-label="发送"><svg class="icon" data-icon="arrow-up"></svg></button></div></div>
            <div id="model-picker" class="model-picker hidden" role="listbox" aria-label="选择模型"></div>
          </div>
        </footer>
      </main>
      </div>

      <!-- 新建任务 / 重命名任务 弹窗 -->
      <section id="task-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
        <div class="modal-card">
          <header class="modal-head">
            <b id="task-modal-title">新建任务</b>
            <button class="modal-close icon-button muted" data-close title="关闭" aria-label="关闭"><svg class="icon" data-icon="close"></svg></button>
          </header>
          <div class="modal-body">
            <label class="field">
              <span class="field-label">任务名称</span>
              <input id="task-name-input" class="field-input" type="text" maxlength="120" autocomplete="off" placeholder="例如：给登录页加一个「记住我」选项" />
            </label>
            <label class="field" id="task-goal-field">
              <span class="field-label">第一条指令 <span class="field-optional">可选</span></span>
              <textarea id="task-goal-input" class="field-input" rows="3" placeholder="想让 Mocode 先做点什么？留空也行，稍后直接在下方输入。"></textarea>
            </label>
            <label class="field" id="task-space-field">
              <span class="field-label">归属</span>
              <select id="task-space-select" class="field-input"></select>
            </label>
          </div>
          <footer class="modal-foot">
            <button class="btn-ghost" data-close>取消</button>
            <button class="btn-primary" id="task-modal-create">创建任务</button>
          </footer>
        </div>
      </section>
    </div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
