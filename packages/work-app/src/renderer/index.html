<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoCode Work</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="style.css" />
    <script>
      // 首屏前同步应用主题，避免加载闪烁。优先级:localStorage > 系统偏好。
      (function () {
        try {
          var saved = localStorage.getItem('mocode-work-theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (systemDark ? 'dark' : 'light');
          var effectiveTheme = theme === 'system' ? (systemDark ? 'dark' : 'light') : theme;
          document.documentElement.dataset.theme = effectiveTheme;
          // 主题色（accent）同样在首屏前落地：它是纯渲染层偏好，不需要走 IPC。
          document.documentElement.dataset.accent = localStorage.getItem('mocode-work-accent') || 'moss';
          // 同步语言属性，避免首屏语言标记闪烁。
          document.documentElement.lang = localStorage.getItem('mocode-work-language') || 'zh-CN';
        } catch { /* localStorage 不可用时走默认浅色 */ }
      })();
    </script>
  </head>
  <body>
    <div class="app-shell">
      <div class="titlebar"><span class="titlebar-brand"><img class="titlebar-brand-logo" src="../assets/icon.png" alt="MoCode" title="MoCode" /><span class="titlebar-brand-text">MoCode</span></span></div>
      <div class="app-body">
      <aside class="sidebar">
        <header class="brand-row"><button class="icon-button muted" id="sidebar-toggle" data-sidebar-toggle data-i18n-title="sidebar.collapse" data-i18n-aria="sidebar.collapse" aria-pressed="false"><svg class="icon" data-icon="panel-left"></svg></button><div class="brand-actions"><button class="icon-button muted" id="add-project" data-i18n-title="sidebar.addProject" data-i18n-aria="sidebar.addProject"><svg class="icon" data-icon="plus"></svg></button><button class="icon-button muted" id="search-button" data-i18n-title="sidebar.search" data-i18n-aria="sidebar.search"><svg class="icon" data-icon="search"></svg></button><button class="icon-button muted" id="theme-toggle" data-i18n-title="sidebar.theme" data-i18n-aria="sidebar.theme"><svg class="icon" data-icon="moon"></svg><svg class="icon icon-swap" data-icon="sun"></svg></button></div></header>
        <nav class="primary-nav" aria-label="主导航" data-i18n-aria="a11y.primaryNav">
          <button class="nav-item active" id="new-task"><svg class="icon" data-icon="circle-plus"></svg><span data-i18n="nav.newTask">新建任务</span></button>
          <button class="nav-item" id="nav-skills" data-i18n-title="nav.skills" aria-haspopup="dialog"><svg class="icon" data-icon="sparkles"></svg><span data-i18n="nav.skills">Skill 市场</span></button>
          <button class="nav-item" id="nav-mcp" data-i18n-title="nav.mcp" aria-haspopup="dialog"><svg class="icon" data-icon="globe"></svg><span data-i18n="nav.mcp">MCP 接入</span></button>
        </nav>
        <section class="sidebar-section tasks-section"><div id="task-list" class="task-list"><p class="empty-tasks" data-i18n="sidebar.emptyTasks">无任务</p></div></section>
        <button class="sidebar-footer" id="settings-button" data-i18n-title="settings.title" aria-haspopup="dialog" aria-expanded="false">
          <span class="avatar"><svg class="icon mocode-mark" data-icon="mocode-mark"></svg></span>
          <span class="footer-brand">MoCode</span>
        </button>
        <div class="sidebar-resize" id="sidebar-resize" aria-label="拖动调整侧栏宽度" data-i18n-aria="a11y.sidebarResize" role="separator" aria-orientation="vertical"></div>
      </aside>
      <main class="workspace">
        <button class="sidebar-floating-toggle" id="sidebar-toggle-floating" data-sidebar-toggle data-i18n-title="sidebar.expand" data-i18n-aria="sidebar.expand"><svg class="icon" data-icon="panel-left"></svg></button>
        <div class="workspace-actions" aria-label="视图操作" data-i18n-aria="a11y.viewActions"><button id="show-files" data-i18n-title="workspace.browseFiles"><svg class="icon" data-icon="files"></svg></button></div>
          <section id="empty-state" class="empty-state">
          <h1 class="empty-lockup"><img class="empty-mark" src="../assets/icon-mark.png" alt="" aria-hidden="true" /><span class="empty-wordmark" data-i18n="app.emptyWordmark">让 MoCode 为你工作</span></h1>
        </section>
        <section id="conversation" class="conversation" aria-live="polite"></section>
        <!-- 消息导航轨:一个用户消息一个点,点击跳到那条消息(见 renderer.ts 的 syncConvRail)。
             挂在 .workspace 上而不是 #conversation 内部 —— 它不能随内容滚动。 -->
        <nav id="conv-rail" class="conv-rail hidden" aria-label="消息导航" data-i18n-aria="a11y.convRail"></nav>
        <section id="approval-panel" class="approval-panel hidden"></section>
        <aside id="inspector" class="inspector hidden">
          <header class="inspector-header"><b id="inspector-title" data-i18n="inspector.overview">项目概览</b><button id="close-inspector" data-i18n-title="common.close" data-i18n-aria="common.close"><svg class="icon" data-icon="close"></svg></button></header>
          <nav class="inspector-tabs"><button data-tab="overview" class="selected" data-i18n="inspector.tabOverview">概览</button><button data-tab="files" data-i18n="inspector.files">文件</button></nav>
          <div id="inspector-content" class="inspector-content"></div>
        </aside>
        <section id="search-panel" class="search-panel hidden"><div class="search-dialog"><input id="search-input" data-i18n-placeholder="search.placeholder" /><div id="search-results"></div></div></section>
        <!-- 扩展页（Skills / MCP）：覆盖 agent 输出区的整页视图，不是弹窗。
             点击侧栏「Skill 市场」「MCP 接入」切换进来，返回按钮或选择任务时退出。 -->
        <section id="extensions-view" class="extensions-view hidden" role="region" aria-label="扩展">
          <header class="extensions-header">
            <button id="extensions-view-back" class="icon-button muted" data-i18n-title="common.back" data-i18n-aria="common.back" aria-label="返回"><svg class="icon" data-icon="arrow-left"></svg></button>
            <b id="extensions-view-title"></b>
          </header>
          <div id="extensions-view-body" class="extensions-body"></div>
        </section>
        <footer class="composer-area">
          <div class="composer">
            <div id="attachment-list" class="attachment-list"></div>
            <textarea id="prompt" rows="1" data-i18n-placeholder="composer.placeholder"></textarea>
            <div class="composer-actions"><div class="left-actions"><button class="plus-button icon-button-square" id="add-attachment" data-i18n-title="composer.addImage" data-i18n-aria="composer.addImage"><svg class="icon" data-icon="image"></svg></button><button class="compact-button" id="compact-button" data-i18n-title="composer.compactTitle"><svg class="icon icon-inline" data-icon="layers-compress"></svg><span data-i18n="composer.compact">压缩</span></button><span class="context-usage" id="context-usage" data-i18n-title="composer.contextUsage">--</span></div><div class="right-actions"><button id="mode-button" class="model-button" data-i18n-title="composer.switchModel" aria-haspopup="listbox" aria-expanded="false"><span class="mode-label">MoCode Agent</span><svg class="icon icon-inline" data-icon="chevron-down"></svg></button><button id="send-button" class="send-button" data-i18n-title="composer.send" data-i18n-aria="composer.sendAria"><svg class="icon" data-icon="arrow-up"></svg></button></div></div>
          </div>
          <!-- 模型下拉必须挂在 .composer 之外：.composer 有 overflow: hidden，且它并不是定位祖先，
               挂在里面时包含块会随状态漂移（空态 .composer-area 是 static → 包含块退化成 .workspace，
               bottom: 100%+6px 直接把面板顶到视口上方被裁掉）。挂在 .composer-area 下，
               只要 .composer-area 在两种状态下都是定位元素，锚点就恒定。 -->
          <div id="model-picker" class="model-picker hidden" role="listbox" data-i18n-aria="picker.selectModel"></div>
          <div class="empty-chips" aria-label="会话上下文" data-i18n-aria="a11y.conversationContext">
            <div class="chip-menu-wrap">
              <button class="empty-chip" type="button" id="empty-chip-project" data-i18n-title="workspace.switchSpace" aria-haspopup="listbox" aria-expanded="false"><svg class="icon" data-icon="folder"></svg><span class="empty-chip-label" data-i18n="workspace.selectSpace">选择工作空间</span><svg class="icon" data-icon="chevron-down"></svg></button>
              <div id="workspace-picker" class="chip-picker hidden" role="listbox" data-i18n-aria="workspace.selectSpace"></div>
            </div>
          </div>
        </footer>
      </main>
      </div>

      <!-- 设置弹窗：左侧分类导航 + 右侧内容，分类列表化 -->
      <section id="settings-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-modal-title">
        <div class="modal-card settings-card">
          <aside class="settings-nav" role="tablist" aria-label="设置分类" data-i18n-aria="a11y.settingsNav">
            <b id="settings-modal-title" class="settings-nav-title" data-i18n="settings.title">设置</b>
          </aside>
          <div class="settings-main">
            <header class="settings-main-head">
              <b id="settings-section-title" data-i18n="settings.model">模型</b>
              <button class="modal-close icon-button muted" id="settings-close" data-i18n-title="common.close" data-i18n-aria="common.close"><svg class="icon" data-icon="close"></svg></button>
            </header>
            <div id="settings-section" class="settings-section"></div>
          </div>
        </div>
      </section>

      <!-- 模型预设编辑器：新增 / 编辑共用。字段与 ~/.mocode/models/<name>.json 一一对应 -->
      <section id="model-form-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="model-form-title">
        <div class="modal-card model-form-card">
          <header class="modal-head">
            <b id="model-form-title" data-i18n="modelForm.add">添加模型</b>
            <button class="modal-close icon-button muted" data-close data-i18n-title="common.close" data-i18n-aria="common.close"><svg class="icon" data-icon="close"></svg></button>
          </header>
          <div class="modal-body model-form-body">
            <label class="field">
              <span class="field-label" data-i18n="modelForm.providerPreset">提供商预设</span>
              <select id="model-form-template" class="field-input">
                <option value="" data-i18n="modelForm.custom">自定义（全部手填）</option>
              </select>
            </label>
            <label class="field">
              <span class="field-label"><span data-i18n="modelForm.name">预设名</span> <span class="field-optional" data-i18n="modelForm.nameOptional">保存为 ~/.mocode/models/&lt;名&gt;.json</span></span>
              <input id="model-form-name" class="field-input" type="text" maxlength="32" autocomplete="off" spellcheck="false" data-i18n-placeholder="modelForm.namePlaceholder" />
            </label>
            <label class="field">
              <span class="field-label" data-i18n="modelForm.protocol">接口协议</span>
              <select id="model-form-provider" class="field-input">
                <option value="openai" data-i18n="modelForm.protocolOpenai">openai（OpenAI 兼容端点）</option>
                <option value="anthropic" data-i18n="modelForm.protocolAnthropic">anthropic（Anthropic 原生）</option>
              </select>
            </label>
            <label class="field">
              <span class="field-label" data-i18n="modelForm.baseUrl">API 地址</span>
              <input id="model-form-baseurl" class="field-input" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="modelForm.baseUrlPlaceholder" />
            </label>
            <label class="field">
              <span class="field-label"><span data-i18n="modelForm.modelName">模型名</span> <span class="field-optional" data-i18n="modelForm.modelNameOptional">须支持 function calling</span></span>
              <input id="model-form-model" class="field-input" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="modelForm.modelNamePlaceholder" />
            </label>
            <label class="field">
              <span class="field-label"><span data-i18n="modelForm.apiKey">API Key</span> <span class="field-optional" data-i18n="modelForm.apiKeyOptional">仅本机保存</span></span>
              <input id="model-form-apikey" class="field-input" type="password" autocomplete="off" spellcheck="false" data-i18n-placeholder="modelForm.apiKeyPlaceholder" />
            </label>
            <label class="field">
              <span class="field-label"><span data-i18n="modelForm.contextWindow">上下文窗口</span> <span class="field-optional" data-i18n="modelForm.contextWindowOptional">tokens</span></span>
              <input id="model-form-window" class="field-input" type="number" min="1" step="1000" autocomplete="off" data-i18n-placeholder="modelForm.contextWindowPlaceholder" />
            </label>
            <button class="settings-row settings-toggle field-hidden" id="model-form-cache" role="switch" aria-checked="false">
              <span class="settings-row-body"><span class="settings-row-title" data-i18n="modelForm.promptCache">Prompt Cache</span><span class="settings-row-sub" data-i18n="modelForm.promptCacheSub">仅 anthropic 协议生效，可显著降低重复前缀成本</span></span>
              <span class="settings-switch" aria-hidden="true"></span>
            </button>
            <button class="settings-row settings-toggle field-hidden" id="model-form-activate" role="switch" aria-checked="true">
              <span class="settings-row-body"><span class="settings-row-title" data-i18n="modelForm.activate">保存后立即启用</span><span class="settings-row-sub" data-i18n="modelForm.activateSub">写入配置并重启后台 agent，后续任务用这个模型</span></span>
              <span class="settings-switch" aria-hidden="true"></span>
            </button>
            <p class="model-form-error hidden" id="model-form-error"></p>
          </div>
          <footer class="modal-foot">
            <button class="btn-ghost" id="model-form-delete" hidden data-i18n="modelForm.delete">删除</button>
            <span class="modal-foot-spacer"></span>
            <button class="btn-ghost" data-close data-i18n="taskModal.cancel">取消</button>
            <button class="btn-primary" id="model-form-save" data-i18n="modelForm.save">保存</button>
          </footer>
        </div>
      </section>

      <!-- 模型目录浏览：与 mocode 终端 /model browse 等价，共用 ~/.mocode/catalog.json 快照。
           选中条目后回模型表单预填，apiKey 仍由用户确认/粘贴 -->
      <section id="catalog-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="catalog-title">
        <div class="modal-card catalog-card">
          <header class="modal-head">
            <b id="catalog-title" data-i18n="catalog.title">模型目录</b>
            <span class="catalog-meta" id="catalog-meta"></span>
            <button class="icon-button muted" id="catalog-refresh" data-i18n-title="catalog.refreshTitle" data-i18n-aria="catalog.refreshTitle"><svg class="icon" data-icon="regen"></svg></button>
            <button class="modal-close icon-button muted" data-close data-i18n-title="common.close" data-i18n-aria="common.close"><svg class="icon" data-icon="close"></svg></button>
          </header>
          <div class="modal-body catalog-body">
            <label class="field">
              <span class="field-label"><svg class="icon" data-icon="search"></svg> <span data-i18n="catalog.search">搜索</span></span>
              <input id="catalog-search" class="field-input" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="catalog.searchPlaceholder" />
            </label>
            <p class="catalog-status hidden" id="catalog-status"></p>
            <div class="catalog-list" id="catalog-list" role="listbox" aria-label="catalog"></div>
          </div>
        </div>
      </section>

      <!-- MCP server 编辑器：新增 / 编辑共用。落盘 ~/.mocode/mcp.json（标准 mcpServers 格式） -->
      <section id="mcp-form-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="mcp-form-title">
        <div class="modal-card model-form-card">
          <header class="modal-head">
            <b id="mcp-form-title" data-i18n="mcpForm.add">添加 MCP Server</b>
            <button class="modal-close icon-button muted" data-close data-i18n-title="common.close" data-i18n-aria="common.close"><svg class="icon" data-icon="close"></svg></button>
          </header>
          <div class="modal-body model-form-body">
            <label class="field">
              <span class="field-label" data-i18n="mcpForm.preset">常用模板</span>
              <select id="mcp-form-template" class="field-input">
                <option value="" data-i18n="mcpForm.custom">自定义（全部手填）</option>
              </select>
            </label>
            <label class="field">
              <span class="field-label"><span data-i18n="mcpForm.name">名称</span> <span class="field-optional" data-i18n="mcpForm.nameOptional">标识用，唯一</span></span>
              <input id="mcp-form-name" class="field-input" type="text" maxlength="64" autocomplete="off" spellcheck="false" data-i18n-placeholder="mcpForm.namePlaceholder" />
            </label>
            <label class="field">
              <span class="field-label" data-i18n="mcpForm.transport">传输类型</span>
              <select id="mcp-form-transport" class="field-input">
                <option value="stdio" data-i18n="mcpForm.transportStdio">stdio（本地命令行进程）</option>
                <option value="streamable-http" data-i18n="mcpForm.transportHttp">streamable-http（远程 HTTP）</option>
                <option value="sse" data-i18n="mcpForm.transportSse">sse（远程 SSE）</option>
              </select>
            </label>
            <label class="field" id="mcp-form-command-field">
              <span class="field-label"><span data-i18n="mcpForm.command">启动命令</span> <span class="field-optional" data-i18n="mcpForm.commandOptional">如 npx / uvx</span></span>
              <input id="mcp-form-command" class="field-input" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="mcpForm.commandPlaceholder" />
            </label>
            <label class="field" id="mcp-form-args-field">
              <span class="field-label"><span data-i18n="mcpForm.args">参数</span> <span class="field-optional" data-i18n="mcpForm.argsOptional">每行一个</span></span>
              <textarea id="mcp-form-args" class="field-input" rows="3" spellcheck="false" data-i18n-placeholder="mcpForm.argsPlaceholder"></textarea>
            </label>
            <label class="field" id="mcp-form-env-field">
              <span class="field-label"><span data-i18n="mcpForm.env">环境变量</span> <span class="field-optional" data-i18n="mcpForm.envOptional">每行 KEY=VALUE</span></span>
              <textarea id="mcp-form-env" class="field-input" rows="3" spellcheck="false" data-i18n-placeholder="mcpForm.envPlaceholder"></textarea>
            </label>
            <label class="field field-hidden" id="mcp-form-url-field">
              <span class="field-label" data-i18n="mcpForm.url">服务 URL</span>
              <input id="mcp-form-url" class="field-input" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="mcpForm.urlPlaceholder" />
            </label>
            <label class="field field-hidden" id="mcp-form-headers-field">
              <span class="field-label"><span data-i18n="mcpForm.headers">请求头</span> <span class="field-optional" data-i18n="mcpForm.headersOptional">每行 KEY: VALUE</span></span>
              <textarea id="mcp-form-headers" class="field-input" rows="3" spellcheck="false" data-i18n-placeholder="mcpForm.headersPlaceholder"></textarea>
            </label>
            <p class="model-form-error hidden" id="mcp-form-error"></p>
          </div>
          <footer class="modal-foot">
            <button class="btn-ghost" id="mcp-form-delete" hidden data-i18n="mcpForm.delete">删除</button>
            <span class="modal-foot-spacer"></span>
            <button class="btn-ghost" data-close data-i18n="taskModal.cancel">取消</button>
            <button class="btn-primary" id="mcp-form-save" data-i18n="mcpForm.save">保存</button>
          </footer>
        </div>
      </section>

      <!-- MCP 配置导入：粘贴标准 mcpServers JSON（Claude Desktop / Cursor 等格式可直接粘） -->
      <section id="mcp-import-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="mcp-import-title">
        <div class="modal-card">
          <header class="modal-head">
            <b id="mcp-import-title" data-i18n="mcpImport.title">导入 MCP 配置</b>
            <button class="modal-close icon-button muted" data-close data-i18n-title="common.close" data-i18n-aria="common.close"><svg class="icon" data-icon="close"></svg></button>
          </header>
          <div class="modal-body">
            <p class="settings-row-sub" data-i18n="mcpImport.hint">粘贴 JSON（支持 {"mcpServers": {...}}、裸 server map、带 name 的数组），同名条目会被覆盖。</p>
            <label class="field">
              <textarea id="mcp-import-text" class="field-input mcp-import-text" rows="12" spellcheck="false" data-i18n-placeholder="mcpImport.placeholder"></textarea>
            </label>
            <p class="model-form-error hidden" id="mcp-import-error"></p>
          </div>
          <footer class="modal-foot">
            <span class="modal-foot-spacer"></span>
            <button class="btn-ghost" data-close data-i18n="taskModal.cancel">取消</button>
            <button class="btn-primary" id="mcp-import-save" data-i18n="mcpImport.import">导入</button>
          </footer>
        </div>
      </section>

      <!-- Skill 市场：git 仓库 → 本地缓存 → 扫描 SKILL.md → 按需安装 -->
      <section id="skill-market-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="skill-market-title">
        <div class="modal-card catalog-card">
          <header class="modal-head">
            <b id="skill-market-title" data-i18n="skillMarket.title">Skill 市场</b>
            <span class="catalog-meta" id="skill-market-meta"></span>
            <button class="icon-button muted" id="skill-market-refresh" data-i18n-title="skillMarket.refreshTitle" data-i18n-aria="skillMarket.refreshTitle"><svg class="icon" data-icon="regen"></svg></button>
            <button class="modal-close icon-button muted" data-close data-i18n-title="common.close" data-i18n-aria="common.close"><svg class="icon" data-icon="close"></svg></button>
          </header>
          <div class="modal-body catalog-body">
            <div class="skill-market-source">
              <select id="skill-market-source" class="field-input"></select>
              <input id="skill-market-url" class="field-input field-hidden" type="text" autocomplete="off" spellcheck="false" data-i18n-placeholder="skillMarket.urlPlaceholder" />
            </div>
            <p class="catalog-status hidden" id="skill-market-status"></p>
            <div class="catalog-list" id="skill-market-list" role="list" aria-label="skill market"></div>
          </div>
        </div>
      </section>

      <!-- 重命名任务 弹窗（新建任务不再弹窗，标题由首条指令自动摘要） -->
      <section id="task-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
        <div class="modal-card">
          <header class="modal-head">
            <b id="task-modal-title" data-i18n="taskModal.title">重命名任务</b>
            <button class="modal-close icon-button muted" data-close data-i18n-title="common.close" data-i18n-aria="common.close"><svg class="icon" data-icon="close"></svg></button>
          </header>
          <div class="modal-body">
            <label class="field">
              <span class="field-label" data-i18n="taskModal.name">任务名称</span>
              <input id="task-name-input" class="field-input" type="text" maxlength="120" autocomplete="off" data-i18n-placeholder="taskModal.placeholder" />
            </label>
          </div>
          <footer class="modal-foot">
            <button class="btn-ghost" data-close data-i18n="taskModal.cancel">取消</button>
            <button class="btn-primary" id="task-modal-create" data-i18n="taskModal.save">保存</button>
          </footer>
        </div>
      </section>
    </div>
    <script type="module" src="renderer.js"></script>
  </body>
</html>
