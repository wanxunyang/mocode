[package]
name = "mocode-tui"
version = "0.1.0"
edition = "2021"
description = "mocode 的 Rust TUI 前端 —— 经 JSON-over-stdio 复用现有 TS agent-host(增量重构路径 A)"
license = "MIT"

# 路径 A 的产物是一个独立二进制 `mocode-tui`:
#   它 spawn 现有的 TS agent-host 子进程(dist/host/stdio.js),
#   通过 stdin 写命令、stdout 读事件,并用 ratatui 渲染。
#   TS 侧代码零改动 —— 只实现 host/protocol.ts 协议的另一端。
[[bin]]
name = "mocode-tui"
path = "src/main.rs"

[dependencies]
# TUI:ratatui 提供双缓冲 diff 渲染,替掉 TS 侧手搓的 ANSI escape / 行宽跟踪 / 滚动区域管理
ratatui = "0.29"
crossterm = "0.28"

# 协议序列化:对应 TS 侧的 JSON.parse / JSON.stringify
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 错误处理
anyhow = "1.0"

# 显示宽度计算(东亚宽字符 / 组合字符),ratatui 内部也依赖它
unicode-width = "0.2"

[profile.release]
opt-level = 2
lto = true
strip = true
